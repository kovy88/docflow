[project]
name = "docflow"
version = "0.1.0"
description = "Template-driven document extraction with grounded citations and rule checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long strings are left to ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
