[project]
name = "docflow"
version = "0.1.0"
description = "AI document processing platform — unstructured business documents to validated structured data"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    # config / validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    # queue / cache
    "arq>=0.26",
    "redis>=5.2",
    # auth
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    # documents
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pillow>=11.0",
    "python-magic>=0.4.27",
    # storage
    "boto3>=1.35",
    # llm providers
    "anthropic>=0.40",
    "openai>=1.57",
    # observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # misc
    "httpx>=0.28",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
    "reportlab>=4.2",          # generates the evaluation corpus PDFs
    "faker>=33.0",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[project.scripts]
docflow-eval = "docflow.eval.cli:main"
docflow-seed = "docflow.scripts.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "ASYNC",     # async correctness
    "S",         # bandit-ish security
    "T20",       # no print
    "RET",       # returns
    "SIM",       # simplify
    "TID",       # tidy imports
    "PTH",       # pathlib
    "ERA",       # commented-out code
    "PL",        # pylint subset
    "RUF",
]
ignore = [
    "E501",     # line length handled by formatter
    "PLR0913",  # many arguments — common in DI-style constructors
    "PLR0917",  # ditto, positional variant
    "PLR2004",  # magic values in comparisons
    "B008",     # FastAPI Depends() in defaults is idiomatic
    "S101",     # assert (used in tests and internal invariants)
    # Deferred imports are load-bearing here, not sloppiness: they break
    # import cycles between layers (services <-> worker) and keep optional
    # dependencies (boto3, pytesseract, provider SDKs) out of the import path
    # of processes that never use them. Enforcing top-level imports would make
    # the API process import the OCR stack at startup.
    "PLC0415",
    # Module-level singletons (engine, provider, queue pool) are set through
    # `global` in their own accessor functions. The alternative is a DI
    # container, which is more machinery than this codebase needs.
    "PLW0603",
    # Czech/German source strings legitimately contain characters ruff reads as
    # ambiguous (č, ř, ž, non-breaking spaces in currency formats).
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR", "T20"]
"src/docflow/eval/*" = ["T20"]
"src/docflow/scripts/*" = ["T20"]
"alembic/*" = ["ERA", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["docflow"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["docflow"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["docflow.eval.*", "docflow.scripts.*", "tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires Postgres and Redis",
    "slow: slow tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/docflow"]
omit = ["*/eval/*", "*/scripts/*", "*/alembic/*"]
