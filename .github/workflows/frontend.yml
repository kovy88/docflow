name: Frontend

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: frontend

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # NEXT_PUBLIC_API_URL is baked in at build time (it's inlined into the
      # client bundle), so it must be present even for a CI build that never
      # talks to a real API — a missing value here would silently ship
      # "undefined" as the API origin.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: docflow-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
